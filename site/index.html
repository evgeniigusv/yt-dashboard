<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>YouTube-пульт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M8 22V14M14 22V9M20 22V17M26 22V12' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=dev">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="app.js?v=dev" defer></script>
</head>
<body>
<div id="lock" class="lock hidden">
  <form id="lockform" autocomplete="on">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 18V12M10 18V7M15 18v-4M20 18V9"/></svg></span>
    <div style="font-weight:700;font-size:20px;letter-spacing:-0.02em">YouTube-пульт</div>
    <div class="muted small">Данные зашифрованы. Введите пароль дашборда — он сохранится на этом устройстве.</div>
    <input type="text" name="username" value="yt-dashboard" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <div id="pwerr" class="err hidden">Пароль не подходит</div>
    <button type="submit">Открыть</button>
  </form>
</div>
<div id="app" class="hidden">
  <div id="demo" class="demo-banner hidden">Демо-данные: так дашборд будет выглядеть, когда подключится YouTube API. Цифры выдуманы.</div>
  <header class="top">
    <div class="bar">
      <span class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 18V12M10 18V7M15 18v-4M20 18V9"/></svg></span>YouTube-пульт</span>
      <select id="channel" class="ctl" aria-label="Канал"></select>
      <div class="seg" id="period" role="group" aria-label="Период">
        <button data-d="7">7 д</button><button data-d="28" aria-pressed="true">28 д</button><button data-d="90">90 д</button><button data-d="365">год</button>
      </div>
      <span class="spacer"></span>
      <span class="fresh" id="fresh"></span>
      <button class="ctl" id="theme" title="Светлая / тёмная тема" aria-label="Переключить тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="drawer" class="drawer hidden"><div class="panel" id="panel"></div></div>
</body>
</html>
