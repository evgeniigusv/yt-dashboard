name: collect

on:
  schedule:
    - cron: "23 */2 * * *"   # backup only — the ticker workflow starts collect every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "collector/**", "channels.json", ".github/workflows/collect.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

# A run that hangs (2026-10-06: stuck >1 day "waiting" on the github-pages environment) must not block the queue:
# every new run cancels whatever is still in progress (a normal run takes ~1 min, runs are hourly).
concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous data (branch "data")
        run: |
          mkdir -p site/data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            git --work-tree=site/data checkout FETCH_HEAD -- . || true
            git reset -q
          fi
          ls -la site/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -q -r collector/requirements.txt

      - name: Collect
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_TOKENS: ${{ secrets.YT_TOKENS }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          DEPLOY_KEY_CHALKONAUT: ${{ secrets.DEPLOY_KEY_CHALKONAUT }}
        run: python collector/collect.py

      - name: Save data (single commit, no history growth)
        run: |
          cd site/data
          git init -q -b data
          git add -A
          git -c user.name="collector" -c user.email="collector@users.noreply.github.com" commit -q -m "data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Keep the schedule alive (GitHub pauses cron after 60 days without commits)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git -c user.name="collector" -c user.email="collector@users.noreply.github.com" commit -q --allow-empty -m "keepalive"
            git push -q origin HEAD:main
          fi

      - name: Cache-bust app.js / style.css (phones keep old files otherwise)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}/g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
